services:
  db:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: time_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d time_control"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mvp_app:${POSTGRES_PASSWORD}@db:5432/time_control
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_SUPERUSER_PASSWORD}@db:5432/time_control
      ENVIRONMENT_ID: ${ENVIRONMENT_ID}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-tc_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrador}
    ports:
      - "3000:3000"
volumes:
  postgres_data:
