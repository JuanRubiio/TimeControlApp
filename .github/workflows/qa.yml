name: QA

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  unit-contract-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run qa:smoke
      - run: npm run build
        env:
          # Valores sintéticos: Next evalúa rutas durante el build, sin conectar a PostgreSQL.
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          ENVIRONMENT_ID: 00000000-0000-4000-8000-000000000001
